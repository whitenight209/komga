name: Build JAR

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: WebUI - Setup
        uses: ./.github/actions/setup-web
        with:
          working-directory: komga-webui

      - name: WebUI - Build
        working-directory: komga-webui
        run: npm run build

      - name: NextUI - Setup
        uses: ./.github/actions/setup-web
        with:
          working-directory: next-ui

      - name: NextUI - Build
        working-directory: next-ui
        run: npm run build:with-i18n

      - name: Build executable JAR
        run: ./gradlew :komga:webuiCopyIndex :komga:nextuiCopyIndex :komga:bootJar

      - name: Upload executable JAR
        uses: actions/upload-artifact@v7
        with:
          name: komga-jar-${{ github.sha }}
          path: |
            komga/build/libs/komga-*.jar
            !komga/build/libs/*-plain.jar
          if-no-files-found: error
          retention-days: 30
